<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miimo Monitor</title>
<link rel="icon" href="assets/miimo_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Nunito:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--mint:#0B8465;--mint-dk:#086B52;--mint-lt:#E3F6EF;--mint-br:#22C39A;--ink:#16151A;--mute:#5A6472;--dim:#7B8592;--faint:#9AA3B0;--line:#EEF1F4;--line2:#E3E8EC;--bg:#F4F7F6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Nunito','Noto Sans KR',sans-serif;color:var(--ink);word-break:keep-all}
a{color:var(--mint)}a:hover{color:var(--mint-dk)}
button{font-family:inherit;color:inherit}
.kr{font-family:'Noto Sans KR',sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:400;line-height:1;font-variation-settings:'FILL' 1;-webkit-font-smoothing:antialiased;user-select:none}
@keyframes mmRing{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.1);opacity:0}}
@keyframes mmBuzz{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
@keyframes mmPop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes mmWave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes mmSpin{to{transform:rotate(360deg)}}
@keyframes mmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* header */
.hdr{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;padding:12px 32px;background:#fff;border-bottom:1px solid #E9EDF0}
.logo{display:flex;align-items:center;gap:12px}
.logo-box{width:50px;height:50px;border-radius:17px;background:var(--mint-lt);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.logo-box img{height:46px;width:auto}
.logo-t{font-weight:900;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.logo-t span{color:var(--mint)}
.logo-s{font-weight:700;font-size:12px;color:var(--dim);margin-top:2px}
.tabs{display:flex;gap:4px;padding:4px;background:#F0F3F5;border-radius:16px}
.tab{display:flex;align-items:center;gap:7px;border:none;cursor:pointer;padding:10px 18px;border-radius:12px;font-weight:800;font-size:15px;background:transparent;color:var(--mute);box-shadow:none}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,22,40,.12)}
.tab .ms{font-size:20px}
.grow{flex:1}
.hdr-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.chip{display:flex;align-items:center;gap:7px;font-family:'Noto Sans KR',sans-serif;font-size:13px}
.chip b{font-weight:700}.chip i{font-style:normal;font-weight:500;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.pill-link{display:flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #CFE9DF;border-radius:999px;background:#fff;color:var(--mint);font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;text-decoration:none}
.pill-link .ms{font-size:17px}
.mode{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font-weight:900;font-size:13px;letter-spacing:.06em}
.mode .ms{font-size:17px}
.mode.sim{background:var(--ink);color:#fff}.mode.live{background:var(--mint-lt);color:var(--mint)}

/* layout */
main{padding:24px 32px 32px;display:flex;flex-direction:column;gap:20px;max-width:1920px;margin:0 auto}
.card{background:#fff;border-radius:24px;padding:20px 24px;box-shadow:0 6px 20px rgba(20,22,40,.04)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.h2{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:19px;flex:none;white-space:nowrap}
.h2.lg{font-size:21px}
.cnt{font-weight:800;font-size:13px;color:var(--dim)}
.hint{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:13px;color:var(--dim)}
.lbl{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;color:var(--mute);margin-bottom:8px}
.link-btn{margin-left:auto;display:flex;align-items:center;gap:4px;border:none;background:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;color:var(--mint)}
.link-btn:hover{color:var(--mint-dk)}.link-btn .ms{font-size:18px}
.row2{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.row2s{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}

/* hero */
.hero{background:#fff;border-radius:28px;box-shadow:0 8px 28px rgba(20,22,40,.05);overflow:hidden}
.hero-bar{height:7px;transition:background .4s}
.hero-cols{display:flex;flex-wrap:wrap;background:#fff}
.col{flex:1 1 340px;min-width:0;background:#fff;padding:24px 28px 28px;display:flex;flex-direction:column;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.col-h{display:flex;align-items:center;gap:10px}
.num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.col-t{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:17px}
.col-tag{margin-left:auto;font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--faint)}
.col-b{flex:1;min-height:450px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.stack{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.det{gap:18px}.det.pop{animation:mmPop .45s cubic-bezier(.2,.9,.3,1.2) both}
.det-icon{position:relative;width:176px;height:176px;border-radius:40px;display:flex;align-items:center;justify-content:center}
.det-icon .ms{font-size:88px}
.img{position:absolute;inset:0;width:100%;height:100%;background-position:center;background-size:contain;background-repeat:no-repeat}
.det-name{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:clamp(36px,3.2vw,60px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pill{display:flex;align-items:center;gap:7px;padding:10px 18px;border-radius:999px;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:18px}
.pill .ms{font-size:22px}.pill.gray{background:#F4F6F8;color:var(--ink);gap:8px}.pill b{font-family:'Nunito',sans-serif;font-weight:900}
.conf{width:260px;max-width:100%;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.conf i{display:block;height:100%;border-radius:4px;transition:width .5s}
.det-time{font-weight:700;font-size:14px;color:var(--dim)}
.idle-ring{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center}
.idle-ring:before{content:'';position:absolute;inset:14px;border-radius:50%;background:var(--mint-lt)}
.idle-ring img{position:relative;width:170px;height:auto;animation:mmFloat 3.2s ease-in-out infinite}
.off-ring{width:210px;height:210px}.off-ring:before{background:#F0F3F5}.off-ring img{width:150px;filter:grayscale(1);opacity:.75;animation:none}
.wave{display:flex;align-items:center;gap:5px;height:26px}
.wave span{width:5px;border-radius:3px;background:var(--mint-br);animation:mmWave 1s ease-in-out infinite}
.wave span:nth-child(1),.wave span:nth-child(5){height:12px}.wave span:nth-child(2),.wave span:nth-child(4){height:20px}.wave span:nth-child(3){height:26px}
.wave span:nth-child(2){animation-delay:.15s}.wave span:nth-child(3){animation-delay:.3s}.wave span:nth-child(4){animation-delay:.45s}.wave span:nth-child(5){animation-delay:.6s}
.idle-t{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:34px;letter-spacing:-.02em}
.off-t{font-size:30px;text-wrap:balance}
.idle-s{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:16px;color:var(--mute);max-width:380px;text-wrap:pretty}
.btn{display:flex;align-items:center;gap:8px;height:50px;padding:0 22px;border:none;border-radius:16px;background:var(--mint);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.btn:hover{background:var(--mint-dk)}.btn .ms{font-size:20px}
.btn.kr{font-weight:700}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}.btn.ghost:hover{background:var(--bg)}
.btn.h54{height:54px;padding:0 26px}

/* dial */
.sq{position:relative;width:100%;max-width:372px;aspect-ratio:1}
.sq svg{position:absolute;inset:0;width:100%;height:100%}
.sweep{position:absolute;inset:12.5%;border-radius:50%;opacity:.28;animation:mmSpin 1.4s linear infinite}
.arrow{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,1.25,.5,1),opacity .3s}
.arrow svg{display:block;position:static;width:100%;height:100%}
.dl{position:absolute;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;color:var(--dim);white-space:nowrap;text-align:center;line-height:1.3}
.dl.top{top:0;left:50%;transform:translateX(-50%)}
.dl.bot{bottom:0;left:50%;transform:translateX(-50%);font-weight:900;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:2px}
.dl.bot .ms{font-size:18px}
.dl.r{right:0;top:50%;transform:translateY(-50%)}.dl.l{left:0;top:50%;transform:translateY(-50%)}
.dl.c{top:51%;left:50%;transform:translate(-50%,-50%);color:var(--faint)}
.big{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:0 14px;min-height:56px;line-height:56px}
.big-n{font-weight:900;font-size:56px;line-height:1}
.big-s{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:26px;letter-spacing:-.01em}
.note{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:14px;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:13px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.ldot{width:13px;height:13px;border-radius:50%;flex:none}

/* motor nodes */
.node{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%)}
.node.btn-node{width:17%;padding:0;border:none;background:none;cursor:pointer}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid;animation:mmRing 1.1s ease-out infinite}
.ring.d2{animation-delay:.55s}
.core{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;transition:background .25s,color .25s;border:3px solid transparent}
.core.on{animation:mmBuzz .16s linear infinite}
.summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;padding:16px 28px;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:19px;transition:background .4s,color .4s}
.summary .ms{font-size:22px}

/* tables */
.tbl{overflow-x:auto}
.trow{display:grid;grid-template-columns:74px minmax(170px,1.5fr) 58px minmax(150px,1fr) 50px minmax(90px,.7fr);align-items:center;gap:12px;min-width:660px;padding:8px;border-top:1px solid #F0F2F5;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:15px}
.trow:hover{background:#F7F9F8}
.trow.h{grid-template-columns:84px minmax(180px,1.5fr) 62px minmax(160px,1fr) 60px minmax(100px,.8fr) 56px;min-width:780px;padding:10px 8px}
.trow.head{cursor:default;border-top:none;padding:12px 8px;font-weight:700;font-size:13px;color:var(--dim)}.trow.head:hover{background:transparent}
.trow.sel{background:var(--mint-lt);border-radius:12px}
.t-time{font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--dim)}
.t-snd{display:flex;align-items:center;gap:10px;min-width:0}
.t-ico{position:relative;flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.t-ico .ms{font-size:20px}.trow.h .t-ico{width:38px;height:38px;border-radius:11px}
.t-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sev{justify-self:start;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px}
.t-dir{display:flex;align-items:center;gap:6px;font-weight:500}.t-dir .ms{font-size:18px}
.t-num{font-family:'Nunito',sans-serif;font-weight:800}
.t-mot{font-family:'Nunito',sans-serif;font-weight:800;color:var(--mute)}
.t-src{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:var(--dim)}
.empty{display:flex;align-items:center;justify-content:center;gap:14px;padding:44px 0;border-top:1px solid #F0F2F5;font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:16px;color:var(--mute)}
.empty img{height:64px;width:auto}
.empty.tall{flex-direction:column;gap:12px;padding:64px 0}.empty.tall img{height:110px}

/* system */
.sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:16px}
.mic{display:flex;align-items:center;gap:8px}
.mic-l{font-weight:800;font-size:12px;color:var(--mute);width:38px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transform-origin:left center;transition:transform .12s linear}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #F0F2F5;font-family:'Noto Sans KR',sans-serif;font-size:14px}
.kv span:first-child{font-weight:500;color:var(--mute)}.kv span:last-child{font-weight:700;text-align:right}

/* history */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.h1{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:28px;letter-spacing:-.02em}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:#F0F3F5;border-radius:14px}
.seg.dk{background:#E9EDF0}
.seg button{border:none;cursor:pointer;padding:9px 16px;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;background:transparent;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,22,40,.12)}
.seg.nu button{font-family:inherit;font-weight:800;padding:9px 18px}
select.sel{height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:14px;background:#fff;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.detail{display:flex;flex-direction:column;gap:18px;padding:24px}
.d-head{display:flex;align-items:center;gap:16px}
.d-ico{position:relative;flex:none;width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center}.d-ico .ms{font-size:36px}
.d-name{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:24px;letter-spacing:-.01em}
.d-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-family:'Noto Sans KR',sans-serif;font-size:14px}
.d-meta i{font-style:normal;font-weight:500;color:var(--mute)}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.d-box{background:#F7F9F8;border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.d-box .cap{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:15px;text-align:center}
.mini-dial{position:relative;width:128px;height:128px;border-radius:50%;border:2px solid #DDE3E8;background:#fff}
.mini-dial .ar{position:absolute;inset:0}
.mini-dial .ar i{position:absolute;left:50%;top:10px;width:4px;height:54px;margin-left:-2px;border-radius:2px}
.mini-dial .ar b{position:absolute;left:50%;top:2px;width:16px;height:16px;margin-left:-8px;border-radius:50%}
.mini-dial .ctr{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--ink)}
.mini-neck{position:relative;width:128px;height:128px}
.mini-neck svg{position:absolute;inset:0;width:100%;height:100%}
.mini-neck .nd{position:absolute;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid}
.dkv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #F0F2F5;font-family:'Noto Sans KR',sans-serif;font-size:14px}
.dkv span:first-child{font-weight:500;color:var(--mute)}.dkv span:last-child{font-weight:700;text-align:right}
.cap-sm{font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--dim);margin-bottom:8px}
pre.json{margin:0;padding:14px;border-radius:14px;background:#F7F9F8;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;color:var(--ink);overflow:auto;max-height:230px}

/* device */
.conn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.dev{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:18px;background:#F7F9F8}
.dev>.ms{font-size:30px}
.dev-n{font-weight:900;font-size:16px}.dev-d{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:13px;color:var(--mute)}.dev-l{font-weight:800;font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap}
.dev-st{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;white-space:nowrap}
.ws{flex:0 1 460px;min-width:0;display:flex;gap:8px}
.ws input{flex:1 1 0;min-width:0;height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:14px;font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--ink);outline-color:var(--mint)}
.ws .btn{height:46px;padding:0 20px;border-radius:14px;flex:none;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:15px}.ws .btn .ms{font-size:19px}
.ws .btn.off{background:var(--mute)}.ws .btn.off:hover{background:var(--mute)}
.banner{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:18px}
.banner img{height:48px;width:auto}
.banner span{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:15px;text-wrap:pretty}
.tag{flex:none;white-space:nowrap;padding:4px 10px;border-radius:999px;font-weight:900;font-size:11px;letter-spacing:.06em;background:var(--ink);color:#fff}
.tag.warn{background:#FFF4E0;color:#B45309;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:12px;letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:9px;padding:8px 10px;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;text-align:left;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;line-height:1.3}
.tile.on{border-color:var(--mint);background:var(--mint-lt)}
.tile i{display:block;flex:none;width:38px;height:38px;background-position:center;background-size:contain;background-repeat:no-repeat}
.wrap{display:flex;flex-wrap:wrap;gap:20px 32px}
.half{flex:1 1 300px;min-width:0}
.vals{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.vals .n{font-weight:900;font-size:24px}.vals .d{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:15px}
input[type=range]{width:100%;accent-color:var(--mint);cursor:pointer}
.tog{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;margin-top:10px;padding:4px 0;border:none;background:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;color:var(--ink);text-align:left}
.tog i{font-style:normal;font-weight:500;color:var(--dim)}
.tog.auto{width:auto;gap:12px;padding:4px 2px;margin:0}
.sw{position:relative;flex:none;width:46px;height:26px;border-radius:13px;background:#D5DBE1;transition:background .2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--mint)}.sw.on:after{transform:translateX(20px)}
.mbtns{display:flex;gap:6px}
.mbtns button{width:46px;height:46px;border:none;border-radius:50%;background:#E9EDF0;color:var(--mute);font-weight:900;font-size:14px;cursor:pointer}
.mbtns button.on{background:var(--mint);color:#fff}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-top:18px;border-top:1px solid #F0F2F5}
.last{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:15px}
.last .ms{font-size:20px}.last span{text-wrap:pretty}
.last .link-btn{flex:none;color:inherit;font-family:inherit}
.test-wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 28px}
.neck280{width:280px;max-width:100%}
.test-list{flex:1 1 180px;display:flex;flex-direction:column;gap:8px}
.tbtn{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:14px;background:#fff;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:14px}
.tbtn:hover{border-color:var(--mint-br)}.tbtn.on{background:var(--mint-lt);border-color:var(--mint-br)}
.tbtn b{font-family:'Nunito',sans-serif;font-weight:900;font-size:15px}.tbtn i{font-style:normal;font-weight:500;color:var(--mute)}
.tbtn em{margin-left:auto;display:flex;align-items:center;gap:4px;font-style:normal;font-weight:700;color:var(--mint)}.tbtn em .ms{font-size:18px}
.sub-l{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;color:var(--dim);margin-bottom:6px}
.pos-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid #F0F2F5;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px}
.pos-row select{height:36px;padding:0 10px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;cursor:pointer}
.sect-row{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F0F2F5;font-family:'Noto Sans KR',sans-serif;font-size:14px}
.sect-row b{font-weight:700}.sect-row i{font-family:'Nunito',sans-serif;font-weight:700;font-style:normal;color:var(--mute)}.sect-row em{font-family:'Nunito',sans-serif;font-weight:900;font-style:normal}
.mic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 24px}
.mic-grid .mic{gap:10px}.mic-grid .mic-l{font-size:13px;width:42px}.mic-grid .bar{height:10px;border-radius:5px}.mic-grid .ms{font-size:20px}
.dimmed{opacity:.45}
</style>
</head>
