<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miimo Remote</title>
<link rel="icon" href="assets/miimo_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Nunito:wght@600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--mint:#0B8465;--mint-dk:#086B52;--mint-lt:#E3F6EF;--mint-br:#22C39A;--ink:#16151A;--mute:#5A6472;--dim:#7B8592;--line:#EEF1F4;--line2:#E3E8EC;--bg:#F4F7F6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Nunito','Noto Sans KR',sans-serif;color:var(--ink);word-break:keep-all}
button{font-family:inherit;color:inherit}
.kr{font-family:'Noto Sans KR',sans-serif}
.ms{font-family:'Material Symbols Rounded';font-weight:400;line-height:1;font-variation-settings:'FILL' 1;-webkit-font-smoothing:antialiased;user-select:none}

.hdr{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:12px 32px;background:#fff;border-bottom:1px solid #E9EDF0}
.logo{display:flex;align-items:center;gap:12px}
.logo-box{width:50px;height:50px;border-radius:17px;background:var(--mint-lt);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.logo-box img{height:46px;width:auto}
.logo-t{font-weight:900;font-size:22px;letter-spacing:-.01em;line-height:1.1}.logo-t span{color:var(--mint)}
.logo-s{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:12px;color:var(--dim);margin-top:2px}
.grow{flex:1}
.link-st{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px}
.link-st.on{background:var(--mint-lt);color:var(--mint)}.link-st.off{background:#FFF4E0;color:#B45309}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.pill-link{display:flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid #CFE9DF;border-radius:999px;background:#fff;color:var(--mint);font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;text-decoration:none}
.pill-link .ms{font-size:17px}

main{display:flex;flex-wrap:wrap;align-items:flex-start;gap:20px;padding:24px 32px 32px;max-width:1680px;margin:0 auto}
.left{flex:1.25 1 480px;min-width:0;display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 6px 20px rgba(20,22,40,.04)}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:16px}
.h2{font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:21px;flex:none;white-space:nowrap}
.h2.sm{font-size:19px}
.hint{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:14px;color:var(--mute)}
.hint.sm{font-size:13px;color:var(--dim)}
.lbl{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;color:var(--mute);margin-bottom:8px}

/* presets */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pwrap{position:relative}
.preset{width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border:2px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;text-align:left;font-family:'Noto Sans KR',sans-serif;transition:background .25s,transform .1s}
.preset:active{transform:scale(.97)}
.preset.sel{border-color:var(--mint)}
.p-top{display:flex;align-items:center;gap:8px}
.p-ico{width:52px;height:52px;border-radius:15px;display:block}
.p-ico i{display:block;width:100%;height:100%;background-position:center;background-size:contain;background-repeat:no-repeat}
.p-key{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;background:#F0F3F5;font-family:'Nunito',sans-serif;font-weight:900;font-size:13px;color:var(--mute)}
.p-name{font-weight:900;font-size:17px;line-height:1.3}
.p-dir{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14px}.p-dir .ms{font-size:17px}
.p-tags{display:flex;flex-wrap:wrap;gap:6px}
.sev{padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px}
.mot{padding:3px 10px;border-radius:999px;background:#F4F6F8;color:var(--mute);font-family:'Nunito','Noto Sans KR',sans-serif;font-weight:800;font-size:12px}
.edit{position:absolute;top:10px;right:10px;width:44px;height:44px;border:none;border-radius:13px;background:#F0F3F5;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center}
.edit.sel{background:var(--mint);color:#fff}.edit .ms{font-size:21px}
.add{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #C9D1D9;border-radius:20px;background:transparent;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;color:var(--mute)}
.add:hover{border-color:var(--mint-br);color:var(--mint)}.add .ms{font-size:26px}

/* log */
.log-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.btn{display:flex;align-items:center;gap:7px;height:46px;padding:0 16px;border:1px solid var(--line2);border-radius:14px;background:#fff;color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{background:var(--bg)}.btn .ms{font-size:19px}
.btn.primary{flex:1 1 200px;height:54px;padding:0 22px;border:none;border-radius:16px;background:var(--mint);color:#fff;font-size:16px;gap:8px}
.btn.primary:hover{background:var(--mint-dk)}.btn.primary .ms{font-size:22px}
.btn.danger{height:54px;padding:0 18px;border-radius:16px;color:#B42318;font-size:15px;gap:8px}
.btn.danger:hover{background:#FEECEB}.btn.danger .ms{font-size:20px}
.log-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #F0F2F5;font-family:'Noto Sans KR',sans-serif;font-size:14px}
.log-row b{font-family:'Nunito',sans-serif;font-weight:800;color:var(--dim)}.log-row span{font-weight:700}
.log-empty{padding:14px 0 4px;border-top:1px solid #F0F2F5;font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:14px;color:var(--dim)}

/* editor */
.editor{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px}
.ed-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ed-tag{padding:4px 12px;border-radius:999px;background:var(--mint-lt);color:var(--mint);font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 10px;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;text-align:left;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;line-height:1.3}
.tile.on{border-color:var(--mint);background:var(--mint-lt)}
.tile i{flex:none;display:block;width:36px;height:36px;background-position:center;background-size:contain;background-repeat:no-repeat}
.dir-wrap{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center}
.dir-grid{display:grid;grid-template-columns:repeat(3,76px);grid-auto-rows:52px;gap:6px}
.dir-grid button{border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:12px;line-height:1.25;padding:0 2px}
.dir-grid button.on{border-color:var(--mint);background:var(--mint-lt)}
.dir-grid button.c{border-color:transparent;background:#F4F6F8;color:var(--dim);cursor:default}
.dir-r{flex:1 1 200px;min-width:0}
.vals{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.vals .n{font-weight:900;font-size:28px;line-height:1}.vals .n.sm{font-size:22px}.vals .d{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:15px}
input[type=range]{width:100%;accent-color:var(--mint);cursor:pointer}
.note{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:12px;color:var(--dim);margin-top:4px}
.tog{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;gap:10px;margin-top:6px;padding:0;border:none;background:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;color:var(--ink);text-align:left}
.tog i{font-style:normal;font-weight:500;color:var(--dim)}
.sw{position:relative;flex:none;width:46px;height:26px;border-radius:13px;background:#D5DBE1;transition:background .2s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--mint)}.sw.on:after{transform:translateX(20px)}
.wrap{display:flex;flex-wrap:wrap;gap:16px 28px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:#F0F3F5;border-radius:14px}
.seg button{border:none;cursor:pointer;min-height:40px;padding:0 14px;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14px;background:transparent;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,22,40,.12)}
.mbtns{display:flex;gap:6px}
.mbtns button{width:46px;height:46px;border:none;border-radius:50%;background:#E9EDF0;color:var(--mute);font-weight:900;font-size:14px;cursor:pointer}
.mbtns button.on{background:var(--mint);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:18px;border-top:1px solid #F0F2F5}
</style>
</head>
<body>
<div id="app"></div>
<script src="remote.js"></script>
</body>
</html>
